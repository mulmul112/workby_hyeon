<!------------------------------------------------슬라이드-->
<style>
/* 슬라이드 전체 영역 */
.slideshow {
  position: relative;
  width: 1000px;
  height: 500px;
  overflow: hidden;
  background: #eee;
}

.slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1s ease-in-out;
}

.slide.active {
  opacity: 1;
  visibility: visible;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
</style>
<!------------------------------------------------슬라이드 + 리스트-->

<div class="content-layout">

  <!-- 왼쪽 슬라이드쇼 -->
  <div class="slideshow">

    <div class="slide active">
      <img src="image/jhibli1.png" alt="Image 1">
    </div>

    <div class="slide">
      <img src="image/jhibli2.png" alt="Image 2">
    </div>

    <div class="slide">
      <img src="image/jhibli3.png" alt="Image 3">
    </div>

    <div class="slide">
      <img src="image/jhibli4.png" alt="Image 4">
    </div>

</div>



 <!-- 오른쪽 리스트 -->

  <h4></h4>

  <ul>

  </ul>
</div>



<!-- ============================= -->

<div class="popup-overlay" id="itemPopup" hidden>

    <!-- 닫기 버튼 -->

      ×

</div>


</div>


<script>
(function() {
  const slideshow = document.querySelector('.slideshow');
  if (!slideshow) return;

  const slides = slideshow.querySelectorAll('.slide');
  let currentSlide = 0;

  setInterval(function() {
    slides[currentSlide].classList.remove('active');

    currentSlide = (currentSlide + 1) % slides.length;

    slides[currentSlide].classList.add('active');
  }, 5000);
})();
</script>
